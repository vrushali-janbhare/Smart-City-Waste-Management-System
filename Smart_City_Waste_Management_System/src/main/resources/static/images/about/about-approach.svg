<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Three steps: waste is collected by truck, sorted into bins with AI scanning, then recycled into new products" xmlns:c2pa="http://c2pa.org/manifest">
