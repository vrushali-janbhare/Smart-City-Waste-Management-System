
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report Waste | E-Safai</title>

    <link rel="stylesheet" href="css/report-waste.css">
    <link rel="stylesheet" href="css/citizen-sidebar.css">
</head>

<body>

    <!-- TOP NAVIGATION -->
    <header class="topbar">

        <div class="brand">
            E-Safai
        </div>

        <nav class="top-navigation">
            <a href="user-dashboard.html">Dashboard</a>
            <a href="my-complaints.html">My Complaints</a>
            <a href="#" id="logoutBtn">Logout</a>
        </nav>

    </header>


    <!-- MAIN CONTENT -->
    <main class="page-container">

        <!-- PAGE HEADING -->
        <section class="page-heading">

            <div>
                <h1>Report Waste</h1>

                <p class="subtitle">
                    Report waste problems in your area
                    and help keep the city clean.
                </p>
            </div>

        </section>


        <!-- REPORT WASTE FORM -->
        <section class="form-card">

            <form id="reportWasteForm">

                <!-- WASTE CATEGORY -->
                <div class="form-group">

                    <label for="category">
                        Waste Category
                        <span>*</span>
                    </label>

                    <select id="category" required>
                        <option value="">
                            Select Waste Category
                        </option>
                    </select>

                </div>


                <!-- WASTE DESCRIPTION -->
                <div class="form-group">

                    <label for="description">
                        Waste Description
                        <span>*</span>
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Describe the waste problem..."
                        required></textarea>

                </div>


                <!-- SELECT AREA -->
                <div class="form-group">

                    <label for="area">
                        Select Area
                        <span>*</span>
                    </label>

                    <select id="area" required>
                        <option value="">
                            Select Your Area
                        </option>
                    </select>

                </div>


                <!-- LOCATION ADDRESS -->
                <div class="form-group">

                    <label for="locationAddress">
                        Complete Location Address
                        <span>*</span>
                    </label>

                    <textarea
                        id="locationAddress"
                        rows="3"
                        placeholder="Enter the complete waste location address..."
                        required></textarea>

                </div>


                <!-- LATITUDE AND LONGITUDE -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="latitude">
                            Latitude (Optional)
                        </label>

                        <input
                            type="number"
                            id="latitude"
                            step="any"
                            min="-90"
                            max="90"
                            placeholder="Enter latitude">

                    </div>


                    <div class="form-group">

                        <label for="longitude">
                            Longitude (Optional)
                        </label>

                        <input
                            type="number"
                            id="longitude"
                            step="any"
                            min="-180"
                            max="180"
                            placeholder="Enter longitude">

                    </div>

                </div>


                <!-- COMPLAINT IMAGE UPLOAD -->
                <div class="form-group">

                    <label for="complaintImages">
                        Upload Waste Images (Optional)
                    </label>

                    <input
                        type="file"
                        id="complaintImages"
                        accept="image/jpeg,image/png,image/webp"
                        multiple>

                    <small>
                        Select up to 5 images.
                        JPG, PNG and WEBP formats.
                        Maximum 5 MB per image.
                    </small>

                    <div
                        id="selectedImages"
                        class="selected-images">
                    </div>

                </div>


                <!-- SUCCESS / ERROR MESSAGE -->
                <div
                    id="messageBox"
                    class="message-box"
                    role="status"
                    aria-live="polite">
                </div>


                <!-- FORM BUTTONS -->
                <div class="form-buttons">

                    <button
                        type="reset"
                        id="resetBtn"
                        class="btn-reset">
                        Reset
                    </button>

                    <button
                        type="submit"
                        id="submitBtn"
                        class="btn-submit">
                        Submit Complaint
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <p>
            &copy; 2026 E-Safai Smart City
            Waste Management System
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="js/citizen-sidebar.js"></script>
    <script src="js/report-waste.js"></script>

</body>
</html>
